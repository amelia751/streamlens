[project]
name = "streamlens-backend"
version = "0.1.0"
description = "Streamlens agent backend - Gemini on Vertex AI + ClickHouse Cloud MCP"
requires-python = ">=3.11,<3.14"
dependencies = [
    "google-adk[mcp,db]>=2.8.0",
    # Async drivers for DatabaseSessionService: SQLite locally, Postgres
    # (Cloud SQL) when STREAMLENS_SESSION_DB_URL points at one.
    "sqlalchemy[asyncio]>=2.0.40",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "mcp>=1.24,<2",
    "google-cloud-storage>=2.19.0",
    "google-cloud-secret-manager>=2.20.0",
    "clickhouse-connect>=1.8.0",
    "python-dotenv>=1.0.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "google-cloud-aiplatform[adk,agent-engines]>=1.132.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["streamlens"]
